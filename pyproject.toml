[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlsentry"
version = "0.1.0"
description = "What an anonymous visitor can really do to a Supabase project, shown on a throwaway copy built from its migrations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ['tomli>=1.1; python_version < "3.11"']

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
rlsentry = "rlsentry.cli:main_exit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rlsentry = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
